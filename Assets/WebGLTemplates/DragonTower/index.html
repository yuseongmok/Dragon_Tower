<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Dragon Tower · 전투 프로토타입</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d16;color:#eaf0ff;font-family:system-ui,sans-serif}body{display:grid;place-items:center}#shell{width:min(100vw,56.47dvh);height:min(100dvh,177.08vw);position:relative}canvas{width:100%;height:100%;display:block;touch-action:none}#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;background:#101827;text-align:center;padding:28px}h1{font-size:22px;letter-spacing:5px}progress{width:80%;accent-color:#ef9952}p{line-height:1.6;color:#a8bbd1}#error{color:#ffb3a8;white-space:pre-wrap}</style></head><body><main id="shell"><canvas id="unity-canvas" tabindex="0" aria-label="드래곤 타워 전투"></canvas><div id="loading"><h1>DRAGON TOWER</h1><p>작은 드래곤의 첫 번째 전투</p><progress id="progress" max="1" value="0"></progress><p id="error">전투를 준비하고 있습니다…</p></div></main>
<script src="Build/{{{ LOADER_FILENAME }}}"></script><script>
const canvas=document.getElementById('unity-canvas');
createUnityInstance(canvas,{dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'Dragon Tower Prototype',productName:'Dragon Tower',productVersion:'0.1.0',devicePixelRatio:Math.min(window.devicePixelRatio||1,2)},p=>document.getElementById('progress').value=p).then(instance=>{document.getElementById('loading').style.display='none';window.dragonTower=instance;}).catch(error=>{document.getElementById('error').textContent='게임을 불러오지 못했습니다.\n'+error;});
</script></body></html>
